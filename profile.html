<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Settings — Spectranet Redesign</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <main class="page">
    <h1>Profile Settings</h1>
    <p class="page-subtitle">Update your personal details and notification preferences.</p>

    <form id="profile-form" novalidate>
      <fieldset class="form-group">
        <legend>Personal Information</legend>

        <div class="field">
          <label for="fullName">Full name <span class="required-mark" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            required
            aria-describedby="fullName-error"
            aria-invalid="false"
          >
          <p class="error-message" id="fullName-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="email">Email address <span class="required-mark" aria-hidden="true">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            required
            aria-describedby="email-error"
            aria-invalid="false"
          >
          <p class="error-message" id="email-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="phone">Phone number <span class="required-mark" aria-hidden="true">*</span></label>
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            placeholder="e.g. 08031234567"
            aria-describedby="phone-error phone-hint"
            aria-invalid="false"
          >
          <p class="field-hint" id="phone-hint">11 digits, starting with 0 (e.g. 08031234567)</p>
          <p class="error-message" id="phone-error" role="alert"></p>
        </div>
      </fieldset>

      <fieldset class="form-group">
        <legend>Notification Preferences</legend>

        <div class="field field-toggle">
          <input type="checkbox" id="emailAlerts" name="emailAlerts">
          <label for="emailAlerts">Email alerts</label>
        </div>

        <div class="field field-toggle">
          <input type="checkbox" id="smsAlerts" name="smsAlerts">
          <label for="smsAlerts">SMS alerts</label>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" id="save-btn">Save changes</button>
        <button type="reset" id="cancel-btn" class="btn-secondary">Cancel</button>
      </div>

      <p class="success-message" id="success-message" role="status" hidden>
        Profile updated successfully.
      </p>
    </form>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
